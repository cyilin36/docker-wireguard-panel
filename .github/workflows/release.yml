name: Release

# Pushing a version tag publishes the image and the GitHub release:
#
#   1.2.3          stable       -> image :1.2.3 and :latest, release marked "Latest"
#   1.2.3-rc.1     pre-release  -> image :1.2.3-rc.1 only,     release marked pre-release
#
# The glob below is deliberately loose (any tag with at least two dots); the
# `meta` job validates the tag against the two accepted shapes and fails with an
# actionable message on anything else, so a typo like 1.2.3_rc1 is loud instead
# of silently doing nothing.
on:
  push:
    tags:
      - '*.*.*'

# One run per tag. A re-push while a run is in flight queues instead of racing.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  meta:
    name: Check the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      image: ${{ steps.tag.outputs.image }}
    steps:
      - name: Classify the tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Anchored on purpose: the tag is copied into $GITHUB_OUTPUT below, so
          # nothing that could corrupt that file format may get through.
          stable_re='^[0-9]+\.[0-9]+\.[0-9]+$'
          pre_re='^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z][0-9A-Za-z.-]*$'

          if [[ "$TAG" =~ $stable_re ]]; then
            prerelease=false
          elif [[ "$TAG" =~ $pre_re ]]; then
            prerelease=true
          else
            echo "::error::Tag '$TAG' is not a release tag. Tag a commit as x.y.z (stable) or x.y.z-suffix (pre-release), for example 1.2.3 or 1.2.3-rc.1." >&2
            exit 1
          fi

          # GHCR paths must be lowercase, unlike GitHub repository names.
          image="ghcr.io/${REPOSITORY,,}"

          {
            echo "version=$TAG"
            echo "prerelease=$prerelease"
            echo "image=$image"
          } >> "$GITHUB_OUTPUT"

          echo "version=$TAG prerelease=$prerelease image=$image"

  image:
    name: Build and push the image
    needs: meta
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # buildx signs the provenance attestation with the runner's OIDC token.
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute the tag list
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.meta.outputs.image }}
          # latest=false stops the action from adding :latest behind our back.
          # We add it ourselves below, and only for a stable tag.
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ needs.meta.outputs.version }}
            type=raw,value=latest,enable=${{ needs.meta.outputs.prerelease == 'false' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # Signed provenance for the pushed manifest (this is what the
          # id-token permission above is for).
          provenance: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # A fixed cache scope, because the default scope is the Git ref and
          # every release tag is a brand new ref that could never read the
          # previous release's layers.
          cache-from: type=gha,scope=wgpanel
          cache-to: type=gha,mode=max,scope=wgpanel

      - name: Summarize
        env:
          IMAGE: ${{ needs.meta.outputs.image }}
          VERSION: ${{ needs.meta.outputs.version }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          if [[ "$PRERELEASE" == "true" ]]; then
            latest='_none — this is a pre-release_'
          else
            latest="\`$IMAGE:latest\`"
          fi

          {
            echo "### Image pushed"
            echo
            echo "| tag | value |"
            echo "| --- | --- |"
            echo "| version | \`$IMAGE:$VERSION\` |"
            echo "| latest | $latest |"
            echo "| digest | \`$DIGEST\` |"
            echo "| platforms | linux/amd64, linux/arm64 |"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Create the release
    # Runs only after the image is in the registry, so a failed push cannot
    # leave behind a release announcing an image nobody can pull.
    needs: [meta, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          set -euo pipefail

          # Re-running the workflow for a tag that already has a release (a
          # retried job) must not fail.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists, leaving it untouched."
            exit 0
          fi

          # The notes are generated by the API from the previous release, so a
          # shallow checkout is enough.
          args=(--title "$TAG" --generate-notes --verify-tag)
          if [[ "$PRERELEASE" == "true" ]]; then
            # A pre-release never becomes the repository's "Latest" release.
            args+=(--prerelease)
          else
            args+=(--latest)
          fi

          gh release create "$TAG" "${args[@]}"
