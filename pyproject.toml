[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wgpanel"
version = "0.1.0"
description = "Hot-reload engine for lscr.io/linuxserver/wireguard configuration files"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "starlette>=0.37",
    "uvicorn>=0.30",
    "segno>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
wgpanel = "wgpanel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wgpanel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a running docker compose stack (skipped by default)",
]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PIE", "RUF"]
ignore = ["UP031"]  # percent formatting is fine in test fixtures

[tool.ruff.lint.per-file-ignores]
# The web layer answers the browser in Chinese, so its error strings use
# full-width punctuation on purpose.
"src/wgpanel/web/app.py" = ["RUF001"]
