<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wgpanel</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
  <div class="brand">
    <span class="dot" id="status-dot"></span>
    <h1>wgpanel</h1>
    <span class="iface" id="iface"></span>
  </div>
  <div class="actions">
    <button class="ghost" id="btn-settings">设置</button>
    <button class="ghost" id="btn-refresh">刷新</button>
  </div>
</header>

<div id="banner" class="banner hidden"></div>

<section class="card">
  <div class="card-head">
    <h2>客户端（Peer）</h2>
    <div class="actions">
      <button id="btn-apply" class="ghost hidden">应用改动</button>
      <button id="btn-add" class="primary">添加客户端</button>
    </div>
  </div>

  <p class="legend">
    每个「客户端」就是一台要连进来的设备。
    <b>下行</b>＝服务器发给它的速度，<b>上行</b>＝它发给服务器的速度，<b>在线</b>＝最近 3 分钟内有过握手。
  </p>

  <table id="peers">
    <thead>
      <tr>
        <th title="客户端名字，存在配置文件的 # 注释里">名称</th>
        <th title="它在隧道里的地址，由面板自动分配">隧道地址</th>
        <th title="最近 3 分钟内有握手 = 在线；右侧是最后一次握手距今多久">状态</th>
        <th title="对方的公网地址:端口，没连上时为空">对端地址</th>
        <th class="num" title="服务器 → 客户端，当前速度">下行</th>
        <th class="num" title="客户端 → 服务器，当前速度">上行</th>
        <th class="num" title="建连以来的总流量：↓ 服务器发出，↑ 服务器收到">累计流量</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="peers-body"></tbody>
  </table>
  <p class="empty" id="peers-empty">还没有客户端。点右上角「添加客户端」。</p>
</section>

<section class="card" id="runtime-card">
  <div class="card-head"><h2>接口信息</h2></div>
  <dl class="kv" id="runtime"></dl>
</section>

<!-- 添加客户端 -->
<dialog id="dlg-add">
  <form method="dialog" id="form-add">
    <h3>添加客户端</h3>
    <label>名称
      <input name="name" required pattern="[A-Za-z0-9][A-Za-z0-9_.\-]{0,31}" placeholder="比如 laptop、phone" autocomplete="off">
    </label>
    <label>额外允许的网段
      <input name="extra_allowed_ips" placeholder="可留空，比如 192.168.1.0/24" autocomplete="off">
    </label>
    <p class="hint">隧道地址、密钥、预共享密钥都会自动生成，创建后立即生效。</p>
    <div class="dialog-actions">
      <button value="cancel" class="ghost">取消</button>
      <button value="ok" class="primary" id="btn-add-ok">创建并生效</button>
    </div>
  </form>
</dialog>

<!-- 编辑客户端 -->
<dialog id="dlg-edit">
  <form method="dialog" id="form-edit">
    <h3>编辑客户端</h3>
    <input type="hidden" name="original">
    <label>名称
      <input name="new_name" required pattern="[A-Za-z0-9][A-Za-z0-9_.\-]{0,31}" autocomplete="off">
    </label>
    <label>隧道地址（AllowedIPs）
      <input name="allowed_ips" placeholder="10.0.8.2/32, 192.168.1.0/24" autocomplete="off">
    </label>
    <label>保活间隔（PersistentKeepalive）
      <input name="keepalive" type="number" min="0" max="65535" placeholder="留空 = 不发送">
    </label>
    <label>对端地址（Endpoint）
      <input name="endpoint" placeholder="留空 = 由对方主动连过来" autocomplete="off">
    </label>
    <p class="hint">保存后立即生效，不会重启容器。</p>
    <div class="dialog-actions">
      <button value="cancel" class="ghost">取消</button>
      <button value="ok" class="primary">保存并生效</button>
    </div>
  </form>
</dialog>

<!-- 设置 -->
<dialog id="dlg-settings">
  <form method="dialog" id="form-settings">
    <h3>客户端配置设置</h3>
    <p class="hint">这里填的是发给客户端的配置内容，不写进服务器的 wg0.conf。</p>
    <label>服务器地址
      <input name="server_url" placeholder="vpn.example.com 或你的公网 IP" autocomplete="off">
    </label>
    <label>服务器端口
      <input name="server_port" type="number" min="1" max="65535">
    </label>
    <label>客户端 DNS
      <input name="client_dns" placeholder="10.0.8.1（可留空）" autocomplete="off">
    </label>
    <label>客户端 AllowedIPs
      <input name="client_allowed_ips" placeholder="0.0.0.0/0, ::/0" autocomplete="off">
    </label>
    <label>客户端保活间隔
      <input name="client_keepalive" type="number" min="0" max="65535" placeholder="25">
    </label>
    <div class="dialog-actions">
      <button value="cancel" class="ghost">取消</button>
      <button value="ok" class="primary" id="btn-settings-ok">保存</button>
    </div>
  </form>
</dialog>

<!-- 二维码 -->
<dialog id="dlg-qr">
  <h3 id="qr-title">客户端配置</h3>
  <p class="hint">用手机上的 WireGuard App 扫这个码即可导入。</p>
  <div class="qr-wrap"><img id="qr-img" alt="二维码"></div>
  <div class="dialog-actions">
    <a id="qr-download" class="ghost" download>下载 .conf</a>
    <button class="primary" onclick="document.getElementById('dlg-qr').close()">关闭</button>
  </div>
</dialog>

<div id="toast" class="toast hidden"></div>
<script src="/static/app.js"></script>
</body>
</html>
